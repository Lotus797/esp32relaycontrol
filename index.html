<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Relay Control</title>
<style>
:root{--bg:#12141a;--panel:#1b1e27;--panel-2:#232733;--line:#2c3140;--text:#e8eaf0;--muted:#8b92a5;--on:#ffb340;--on-soft:rgba(255,179,64,.14);--accent:#6ea8ff;--danger:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
h1{margin:0;font-size:1.4rem}
#loginForm{max-width:380px;margin:80px auto 20px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px 24px}
#loginForm h1{margin-bottom:20px;text-align:center}
#loginForm input{width:100%;padding:13px 14px;margin:0 0 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:1rem}
#loginForm input:focus{border-color:var(--accent);outline:none}
#loginBtn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#0c1220;font-weight:600;cursor:pointer}
#dashboard{display:none;max-width:960px;margin:0 auto;padding:20px 16px 48px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.count{color:var(--muted);font-size:.9rem}
.relay-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.relay-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;transition:border-color .25s,background .25s}
.relay-card.on{background:linear-gradient(180deg,var(--on-soft),var(--panel) 70%);border-color:#ffb34088;box-shadow:0 0 24px rgba(255,179,64,.12)}
.relay-card button.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:none;border:0;border-radius:12px;cursor:pointer;text-align:left}
.left{display:flex;align-items:center;gap:12px}
.num{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel-2);color:var(--muted);font-weight:600}
.relay-card.on .num{background:var(--on);color:#2a1a00}
.title{font-weight:600;display:block}
.status{color:var(--muted);font-size:.9rem}
.relay-card.on .status{color:var(--on)}
.sw{width:52px;height:30px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#aab0c2;transition:transform .25s}
.relay-card.on .sw{background:var(--on);border-color:var(--on)}
.relay-card.on .sw::after{transform:translateX(22px);background:#fff}
.bottom{display:flex;gap:10px;margin-top:20px}
.bottom button{flex:1;padding:12px;border-radius:12px;cursor:pointer;background:transparent}
#allOffBtn{color:var(--danger);border:1px solid #ff6b6b66}
#logoutBtn{color:var(--muted);border:1px solid var(--line)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:10px 0 30px}
</style>
</head>
<body>

  <!-- Login form -->
  <div id="loginForm">
    <h1>Relay Control</h1>
    <input type="email" id="email" placeholder="E-poçt" required />
    <input type="password" id="password" placeholder="Şifrə" required />
    <button id="loginBtn">Daxil ol</button>
  </div>

  <!-- Dashboard -->
  <div id="dashboard">
    <div class="head"><h1>Relay Control</h1><span class="count" id="count">0 / 4 aktiv</span></div>
    <div class="relay-container">
      <div class="relay-card" id="card1"><button class="toggle" id="btn1"><span class="left"><span class="num">1</span><span><span class="title">Röle 1</span><span class="status" id="status1">Loading...</span></span></span><span class="sw"></span></button></div>
      <div class="relay-card" id="card2"><button class="toggle" id="btn2"><span class="left"><span class="num">2</span><span><span class="title">Röle 2</span><span class="status" id="status2">Loading...</span></span></span><span class="sw"></span></button></div>
      <div class="relay-card" id="card3"><button class="toggle" id="btn3"><span class="left"><span class="num">3</span><span><span class="title">Röle 3</span><span class="status" id="status3">Loading...</span></span></span><span class="sw"></span></button></div>
      <div class="relay-card" id="card4"><button class="toggle" id="btn4"><span class="left"><span class="num">4</span><span><span class="title">Röle 4</span><span class="status" id="status4">Loading...</span></span></span><span class="sw"></span></button></div>
    </div>
    <div class="bottom">
      <button id="allOffBtn">All OFF</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <footer>Relay Control</footer>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>

  <script>
    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBR-mYG5I9qQGqwWUvaieyvpCx9X9Cq7l8",
      authDomain: "esp32relaycontrol-5a3b9.firebaseapp.com",
      databaseURL: "https://esp32relaycontrol-5a3b9-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esp32relaycontrol-5a3b9",
      storageBucket: "esp32relaycontrol-5a3b9.firebasestorage.app",
      messagingSenderId: "770661185115",
      appId: "1:770661185115:web:48710a5d45a8cfb4ad317e"
    };

    firebase.initializeApp(firebaseConfig);

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginBtn = document.getElementById("loginBtn");

    loginBtn.addEventListener("click", () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }

      // Sign in with Firebase
      firebase.auth().signInWithEmailAndPassword(email, password)
        .then(userCredential => {
          console.log("Signed in as", userCredential.user.email);
          loginForm.style.display = "none";
          dashboard.style.display = "block";
          startRelayControl();
        })
        .catch(error => {
          alert("Firebase login failed: " + error.message);
        });
    });

    function startRelayControl() {
      const db = firebase.database();

      const relays = [
        {id: 1, path: "relay1"},
        {id: 2, path: "relay2"},
        {id: 3, path: "relay3"},
        {id: 4, path: "relay4"},
      ];

      const active = {};

      relays.forEach(relay => {
        const statusText = document.getElementById(`status${relay.id}`);
        const toggleButton = document.getElementById(`btn${relay.id}`);
        const relayRef = db.ref("/" + relay.path);

        relayRef.on("value", (snapshot) => {
          const state = snapshot.val();
          statusText.innerText = state ? "ON" : "OFF";
          document.getElementById(`card${relay.id}`).classList.toggle("on", !!state);
          active[relay.id] = !!state;
          document.getElementById("count").innerText = Object.values(active).filter(Boolean).length + " / 4 aktiv";
        });

        toggleButton.onclick = () => {
          relayRef.get().then(snap => {
            relayRef.set(!snap.val());
          });
        };
      });

      document.getElementById("allOffBtn").onclick = () => {
        relays.forEach(relay => {
          db.ref("/" + relay.path).set(false);
        });
      };
    }

    document.getElementById("logoutBtn").onclick = () => {
      firebase.auth().signOut()
        .then(() => {
          dashboard.style.display = "none";
          loginForm.style.display = "block";
          document.getElementById("email").value = "";
          document.getElementById("password").value = "";
        })
        .catch(error => {
          alert("Logout failed: " + error.message);
        });
    };
  </script>
</body>
</html>
